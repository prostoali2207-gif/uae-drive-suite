name: Apply additional drivers integration

on:
  push:
    branches:
      - feature/additional-contract-drivers
    paths:
      - automation/run-additional-drivers-integration.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/additional-contract-drivers
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused Contracts integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/Contracts.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { SignContractModal } from "@/components/SignContractModal";\n',
              'import { SignContractModal } from "@/components/SignContractModal";\n'
              'import { AdditionalDriversField } from "@/components/AdditionalDriversField";\n'
              'import { saveContractDrivers } from "@/lib/contractDrivers";\n',
          )

          replace_once(
              'interface ClientOption { id: string; full_name: string; }',
              'interface ClientOption {\n'
              '  id: string;\n'
              '  full_name: string;\n'
              '  license_number: string;\n'
              '  license_expiry: string | null;\n'
              '}',
          )

          replace_once(
              '  const [additionalCharges, setAdditionalCharges] = useState<AdditionalCharge[]>([]);\n',
              '  const [additionalCharges, setAdditionalCharges] = useState<AdditionalCharge[]>([]);\n'
              '  const [additionalDriverIds, setAdditionalDriverIds] = useState<string[]>([]);\n',
          )

          replace_once(
              '        supabase.from("clients").select("id, full_name").eq("owner_id", userId).order("full_name"),',
              '        supabase\n'
              '          .from("clients")\n'
              '          .select("id, full_name, license_number, license_expiry")\n'
              '          .eq("owner_id", userId)\n'
              '          .order("full_name"),',
          )

          replace_once(
              '    setVehicleAvailability(null);\n  };',
              '    setVehicleAvailability(null);\n'
              '    setAdditionalDriverIds([]);\n'
              '  };',
          )

          replace_once(
              '      } else {\n        let additionalChargesError: { message?: string } | null = null;',
              '      } else {\n'
              '        try {\n'
              '          await saveContractDrivers(createdId, userId, additionalDriverIds);\n'
              '        } catch (driverError) {\n'
              '          console.error("Additional drivers insert error:", driverError);\n'
              '          await supabase.from("contracts").delete().eq("id", createdId);\n'
              '          toast.error(\n'
              '            "Contract was not created because additional drivers could not be saved: " +\n'
              '              (driverError instanceof Error ? driverError.message : "unknown error"),\n'
              '          );\n'
              '          return;\n'
              '        }\n'
              '        let additionalChargesError: { message?: string } | null = null;',
          )

          replace_once(
              '        setAdditionalCharges([]);\n        setEndTimeManuallyEdited(false);',
              '        setAdditionalCharges([]);\n'
              '        setAdditionalDriverIds([]);\n'
              '        setEndTimeManuallyEdited(false);',
          )

          replace_once(
              '                                  setForm((prev) => ({ ...prev, client_id: c.id }));\n'
              '                                  setClientSelectOpen(false);',
              '                                  setForm((prev) => ({ ...prev, client_id: c.id }));\n'
              '                                  setAdditionalDriverIds((prev) => prev.filter((id) => id !== c.id));\n'
              '                                  setClientSelectOpen(false);',
          )

          client_block = '''                {docExpiredWarnings.length > 0 && (\n                  <div className="rounded-lg bg-destructive/10 border border-destructive/30 px-3 py-2 space-y-1">'''
          replacement = '''                <AdditionalDriversField\n                  clients={clients}\n                  primaryClientId={form.client_id}\n                  value={additionalDriverIds}\n                  onChange={setAdditionalDriverIds}\n                />\n                {docExpiredWarnings.length > 0 && (\n                  <div className="rounded-lg bg-destructive/10 border border-destructive/30 px-3 py-2 space-y-1">'''
          replace_once(client_block, replacement)

          path.write_text(text)
          PY

      - run: npm ci
      - run: npm run build

      - name: Commit verified integration
        run: |
          rm -f automation/run-additional-drivers-integration.txt
          git config user.name "FleetDesk Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Contracts.tsx automation/run-additional-drivers-integration.txt
          git commit -m "feat: connect additional drivers to contract creation"
          git push origin feature/additional-contract-drivers
