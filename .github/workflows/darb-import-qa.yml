name: Darb import QA

on:
  push:
    branches: [feature/darb-fixed-import]
    paths:
      - "src/lib/darbImport.ts"
      - "src/lib/darbImport.test.ts"
      - "src/components/DarbImportDialog.tsx"
      - "src/pages/Fines.tsx"
      - ".github/workflows/darb-import-qa.yml"
      - "tsconfig.darb.json"
  pull_request:
    paths:
      - "src/lib/darbImport.ts"
      - "src/lib/darbImport.test.ts"
      - "src/components/DarbImportDialog.tsx"
      - "src/pages/Fines.tsx"
      - ".github/workflows/darb-import-qa.yml"

jobs:
  darb-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused Darb tests
        run: npx vitest run src/lib/darbImport.test.ts
      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.darb.json
      - name: Build application
        run: npm run build
