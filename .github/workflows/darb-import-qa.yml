name: Darb import QA

on:
  push:
    branches: [feature/darb-fixed-import, feature/separate-salik-darb-tabs, feature/darb-salik-shared-fee]
    paths:
      - "src/lib/darbImport.ts"
      - "src/lib/excelImport.ts"
      - "src/lib/darbImport*.test.ts"
      - "src/components/DarbImportDialog.tsx"
      - "src/components/SalikModal.tsx"
      - "src/components/SalikDetailModal.tsx"
      - "src/pages/ContractDetail.tsx"
      - "supabase/migrations/20261013171500_add_darb_service_fee_settings.sql"
      - "tsconfig.darb-client.json"
      - "src/pages/Settings.tsx"
      - "src/pages/Fines.tsx"
      - "src/lib/tollSource*.ts"
      - ".github/workflows/darb-import-qa.yml"
      - "tsconfig.darb.json"
  pull_request:
    paths:
      - "src/lib/darbImport.ts"
      - "src/lib/excelImport.ts"
      - "src/lib/darbImport*.test.ts"
      - "src/components/DarbImportDialog.tsx"
      - "src/components/SalikModal.tsx"
      - "src/components/SalikDetailModal.tsx"
      - "src/pages/ContractDetail.tsx"
      - "supabase/migrations/20261013171500_add_darb_service_fee_settings.sql"
      - "tsconfig.darb-client.json"
      - "src/pages/Settings.tsx"
      - "src/pages/Fines.tsx"
      - "src/lib/tollSource*.ts"
      - ".github/workflows/darb-import-qa.yml"

jobs:
  darb-import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused Darb tests
        run: npx vitest run src/lib/darbImport.test.ts src/lib/darbImport.flow.test.ts src/lib/tollSource.test.ts
      - name: Check TypeScript
        run: npx tsc --noEmit -p tsconfig.darb.json
      - name: Check Darb client changes
        run: npx tsc --noEmit -p tsconfig.darb-client.json
      - name: Build application
        run: npm run build
