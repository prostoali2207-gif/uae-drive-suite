name: Run Parking contract patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python scripts/patch_parking_contract_charges.py
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ContractDetail.tsx src/components/RecordPaymentModal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Add Parking charges to contract financials"
          git push origin HEAD:main
