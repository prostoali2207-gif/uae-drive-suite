name: Cleanup additional driver automation

on:
  push:
    branches:
      - feature/additional-contract-drivers
    paths:
      - automation/cleanup-additional-driver-automation.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/additional-contract-drivers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remove temporary automation files
        run: |
          rm -f \
            .github/workflows/apply-additional-driver-signatures.yml \
            .github/workflows/apply-additional-drivers-integration.yml \
            .github/workflows/fix-additional-driver-signatures-workflow.yml \
            .github/workflows/retry-additional-driver-signatures.yml \
            .github/workflows/run-relaxed-additional-driver-signatures.yml \
            .github/workflows/run-relaxed-additional-driver-signatures-v2.yml \
            .github/workflows/cleanup-additional-driver-automation.yml \
            automation/run-additional-driver-signatures.txt \
            automation/retry-additional-driver-signatures.txt \
            automation/fix-additional-driver-signatures-workflow.txt \
            automation/run-relaxed-additional-driver-signatures.txt \
            automation/run-relaxed-additional-driver-signatures-v2.txt \
            automation/cleanup-additional-driver-automation.txt
          git config user.name "FleetDesk Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary implementation automation"
          git push origin feature/additional-contract-drivers
