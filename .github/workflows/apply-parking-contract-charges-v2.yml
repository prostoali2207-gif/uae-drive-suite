              s = s.replace('if (transaction.type === "Salik") return "bg-emerald-950 text-emerald-300";', 'if (transaction.type === "Salik") return "bg-emerald-950 text-emerald-300";\n    if (transaction.type === "Parking") return "bg-violet-950 text-violet-300";')

