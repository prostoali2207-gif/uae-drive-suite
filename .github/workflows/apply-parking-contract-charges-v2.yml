              })),
              ...parking.map((charge) => ({
                id: `parking-${charge.id}`,
                category: "parking" as const,
                label: charge.location ? `Parking ${charge.location}` : "Parking",
                due: Number(charge.amount),
                overdueImmediately: true,
              })),
            ];'''.replace('              ...parking','    ...parking').replace('                id: `parking','      id: `parking').replace('                category: "parking','      category: "parking').replace('                label: charge.location','      label: charge.location').replace('                due: Number(charge.amount)','      due: Number(charge.amount)').replace('                overdueImmediately','      overdueImmediately').replace('              }))','    }))').replace('            ];','  ];'), 'gross parking allocation')
              s = s.replace('(["rental", "fees", "fines", "salik"] as const)', '(["rental", "fees", "fines", "salik", "parking"] as const)')
              s = s.replace('Record<"rental" | "fines" | "salik" | "fees", number>', 'Record<"rental" | "fines" | "salik" | "parking" | "fees", number>')
              s = re.sub(r'(salik:\s*0,\n)(\s*)(fees:\s*0,)', r'\1\2parking: 0,\n\2\3', s)

              once('''              salik={salik}
                  chargeImportEvidence={chargeImportEvidence}''', '''              salik={salik}
                  parking={parking}
                  chargeImportEvidence={chargeImportEvidence}'''.replace('                  parking','              parking').replace('                  charge','              charge'), 'FinancialsPanel prop')

              p.write_text(s)

          mpath = Path('src/components/RecordPaymentModal.tsx')
          m = mpath.read_text()
          if 'type AllocationCategory = "rental" | "fines" | "salik" | "parking" | "fees";' not in m:
              m = m.replace('type: "Rental" | "Salik" | "Payment" | "Fine" | "Deposit";', 'type: "Rental" | "Salik" | "Parking" | "Payment" | "Fine" | "Deposit";')
              m = m.replace('type AllocationCategory = "rental" | "fines" | "salik" | "fees";', 'type AllocationCategory = "rental" | "fines" | "salik" | "parking" | "fees";')
              m = m.replace('''    salik: number;
            fees: number;''', '''    salik: number;
            parking: number;
            fees: number;'''.replace('            parking','    parking').replace('            fees','    fees'))
              m = m.replace('''      salik: unpaidEntries
                .filter((entry) => entry.type === "Salik")
                .reduce((sum, entry) => sum + Number(entry.amount), 0),
              fees: 0,''', '''      salik: unpaidEntries
                .filter((entry) => entry.type === "Salik")
                .reduce((sum, entry) => sum + Number(entry.amount), 0),
              parking: unpaidEntries
                .filter((entry) => entry.type === "Parking")
                .reduce((sum, entry) => sum + Number(entry.amount), 0),
              fees: 0,'''.replace('              parking','      parking').replace('                .filter((entry) => entry.type === "Parking")','        .filter((entry) => entry.type === "Parking")').replace('                .reduce((sum, entry) => sum + Number(entry.amount), 0),','        .reduce((sum, entry) => sum + Number(entry.amount), 0),').replace('              fees','      fees'))
              m = m.replace('{ id: "salik", category: "salik", label: "Salik", due: Number(dues.salik) },', '{ id: "salik", category: "salik", label: "Salik", due: Number(dues.salik) },\n      { id: "parking", category: "parking", label: "Parking", due: Number(dues.parking) },')
              m = re.sub(r'(salik:\s*0,\n)(\s*)(fees:\s*0,)', r'\1\2parking: 0,\n\2\3', m)
              mpath.write_text(m)

          mig = Path('supabase/migrations/20260815094500_add_parking_contract_payment_allocations.sql')
          if not mig.exists():
              mig.write_text('''create or replace function public.validate_payment_allocations()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  allocation record;\n  item_id uuid;\n  target_amount numeric;\n  already_allocated numeric;\n  line_total numeric := 0;\n  rental_total numeric := 0;\n  fees_total numeric := 0;\n  fines_total numeric := 0;\n  salik_total numeric := 0;\n  parking_total numeric := 0;\nbegin\n  if lower(coalesce(new.status, '')) <> 'paid' then return new; end if;\n  if new.contract_id is null then raise exception 'Paid payment must belong to a contract'; end if;\n  if jsonb_typeof(coalesce(new.allocations -> 'lines', '{}'::jsonb)) <> 'object' then raise exception 'Payment allocations.lines must be an object'; end if;\n  for allocation in select key, value from jsonb_each_text(coalesce(new.allocations -> 'lines', '{}'::jsonb)) loop\n    if coalesce(allocation.value::numeric, 0) <= 0 then raise exception 'Payment allocation must be greater than zero: %', allocation.key; end if;\n    line_total := line_total + allocation.value::numeric;\n    if allocation.key like 'rental-%' then\n      begin item_id := substring(allocation.key from 8)::uuid; exception when others then raise exception 'Invalid rental allocation reference: %', allocation.key; end;\n      if item_id is distinct from new.contract_id then raise exception 'Rental allocation belongs to another contract: %', item_id; end if;\n      select total_amount into target_amount from public.contracts where id=item_id;\n      if not found then raise exception 'Contract not found: %', item_id; end if;\n      rental_total := rental_total + allocation.value::numeric;\n    elsif allocation.key like 'fee-%' then\n      begin item_id := substring(allocation.key from 5)::uuid; exception when others then raise exception 'Invalid fee allocation reference: %', allocation.key; end;\n      select amount into target_amount from public.contract_fees where id=item_id and contract_id=new.contract_id;\n      if not found then raise exception 'Fee not found in this contract: %', item_id; end if;\n      fees_total := fees_total + allocation.value::numeric;\n    elsif allocation.key like 'fine-%' then\n      begin item_id := substring(allocation.key from 6)::uuid; exception when others then raise exception 'Invalid fine allocation reference: %', allocation.key; end;\n      select amount into target_amount from public.fines where id=item_id and contract_id=new.contract_id;\n      if not found then raise exception 'Fine not found in this contract: %', item_id; end if;\n      fines_total := fines_total + allocation.value::numeric;\n    elsif allocation.key like 'salik-%' then\n      begin item_id := substring(allocation.key from 7)::uuid; exception when others then raise exception 'Invalid Salik allocation reference: %', allocation.key; end;\n      select amount into target_amount from public.salik where id=item_id and contract_id=new.contract_id for update;\n      if not found then raise exception 'Salik transaction not found in this contract: %', item_id; end if;\n      if abs(allocation.value::numeric-target_amount)>0.009 then raise exception 'Salik must be paid in full for transaction %', item_id; end if;\n      salik_total := salik_total + allocation.value::numeric;\n    elsif allocation.key like 'parking-%' then\n      begin item_id := substring(allocation.key from 9)::uuid; exception when others then raise exception 'Invalid Parking allocation reference: %', allocation.key; end;\n      select amount into target_amount from public.parking_charges where id=item_id and contract_id=new.contract_id for update;\n      if not found then raise exception 'Parking charge not found in this contract: %', item_id; end if;\n      parking_total := parking_total + allocation.value::numeric;\n    else raise exception 'Unknown payment allocation type: %', allocation.key;\n    end if;\n    select coalesce(sum((entry.value)::numeric),0) into already_allocated from public.payments p cross join lateral jsonb_each_text(coalesce(p.allocations->'lines','{}'::jsonb)) entry where p.id is distinct from new.id and p.contract_id=new.contract_id and lower(coalesce(p.status,''))='paid' and entry.key=allocation.key;\n    if already_allocated + allocation.value::numeric > target_amount + 0.009 then raise exception 'Payment exceeds remaining amount for %', allocation.key; end if;\n  end loop;\n  if abs(line_total-new.amount)>0.009 then raise exception 'Payment amount must equal allocated line total'; end if;\n  if abs(coalesce((new.allocations->>'rental')::numeric,0)-rental_total)>0.009 or abs(coalesce((new.allocations->>'fees')::numeric,0)-fees_total)>0.009 or abs(coalesce((new.allocations->>'fines')::numeric,0)-fines_total)>0.009 or abs(coalesce((new.allocations->>'salik')::numeric,0)-salik_total)>0.009 or abs(coalesce((new.allocations->>'parking')::numeric,0)-parking_total)>0.009 then raise exception 'Payment category totals do not match allocation lines'; end if;\n  return new;\nend;\n$$;\n\ncreate or replace function public.sync_charge_statuses_from_payments()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare line_key text; item_id uuid; paid_total numeric; charge_amount numeric;\nbegin\n  for line_key in select distinct key from (select key from jsonb_each_text(coalesce(case when tg_op <> 'DELETE' then new.allocations->'lines' end,'{}'::jsonb)) union all select key from jsonb_each_text(coalesce(case when tg_op <> 'INSERT' then old.allocations->'lines' end,'{}'::jsonb))) affected where key like 'fine-%' or key like 'salik-%' or key like 'parking-%' loop\n    if line_key like 'fine-%' then\n      begin item_id:=substring(line_key from 6)::uuid; exception when others then continue; end;\n      select amount into charge_amount from public.fines where id=item_id; if not found then continue; end if;\n      select coalesce(sum((e.value)::numeric),0) into paid_total from public.payments p cross join lateral jsonb_each_text(coalesce(p.allocations->'lines','{}'::jsonb)) e where lower(coalesce(p.status,''))='paid' and e.key=line_key;\n      update public.fines set status=case when paid_total>=charge_amount-0.009 then 'Paid' when paid_total>0 then 'Partial' else 'Unpaid' end, paid_at=case when paid_total>=charge_amount-0.009 then coalesce(paid_at,now()) else null end where id=item_id;\n    elsif line_key like 'salik-%' then\n      begin item_id:=substring(line_key from 7)::uuid; exception when others then continue; end;\n      select amount into charge_amount from public.salik where id=item_id; if not found then continue; end if;\n      select coalesce(sum((e.value)::numeric),0) into paid_total from public.payments p cross join lateral jsonb_each_text(coalesce(p.allocations->'lines','{}'::jsonb)) e where lower(coalesce(p.status,''))='paid' and e.key=line_key;\n      update public.salik set status=case when paid_total>=charge_amount-0.009 then 'Paid' else 'Charged to Client' end, paid_at=case when paid_total>=charge_amount-0.009 then coalesce(paid_at,now()) else null end where id=item_id;\n    else\n      begin item_id:=substring(line_key from 9)::uuid; exception when others then continue; end;\n      select amount into charge_amount from public.parking_charges where id=item_id; if not found then continue; end if;\n      select coalesce(sum((e.value)::numeric),0) into paid_total from public.payments p cross join lateral jsonb_each_text(coalesce(p.allocations->'lines','{}'::jsonb)) e where lower(coalesce(p.status,''))='paid' and e.key=line_key;\n      update public.parking_charges set status=case when paid_total>=charge_amount-0.009 then 'Paid' when paid_total>0 then 'Partial' else 'Unpaid' end, paid_at=case when paid_total>=charge_amount-0.009 then coalesce(paid_at,now()) else null end where id=item_id;\n    end if;\n  end loop;\n  return coalesce(new,old);\nend;\n$$;\n''')
