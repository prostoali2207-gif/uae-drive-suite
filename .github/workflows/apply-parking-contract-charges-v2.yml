              once('''      if (!salikRes.error) setSalik(salikRes.data || []);''', '''      if (!salikRes.error) setSalik(salikRes.data || []);
            if (!parkingRes.error) setParking((parkingRes.data || []) as ParkingRow[]);'''.replace('            if','      if'), 'set parking')
              once('''        salikLastImportAt:
