name: Run isolated booking patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/run-booking-patch.yml]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fleetdesk-booking-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch script stored on isolated branch
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-booking-workflow.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          raw = workflow[start:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(script, 'booking_patch.py', 'exec'))
          PY
      - run: npm ci
      - name: Focused overlap regression test
        run: npm test -- src/lib/contractOverlap.test.ts
      - name: Production build
        run: npm run build
      - name: Commit verified source changes to isolated branch
        run: |
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-booking-workflow.yml
          git add src/components/SignContractModal.tsx src/pages/NewContract.tsx src/pages/ContractDetail.tsx src/pages/Contracts.tsx
          git commit -m "Add safe booking-to-rental workflow"
          git push origin fleetdesk-booking-workflow
      - name: Remove temporary runner from main
        if: always() && github.event_name == 'push'
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-booking-patch.yml
          git commit -m "chore: remove temporary booking patch runner"
          git push origin main
