name: Run isolated booking patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fleetdesk-booking-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize compact NewContract anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/booking_workflow_patch.py')
          s = p.read_text()
          s = s.replace("replace(path, '            onActivate={activateSignedContract}\\n', '')", "replace(path, ' onActivate={activateSignedContract}', '')")
          old = '''replace(\n    path,\n    '<h2 className=\"text-2xl font-bold text-emerald-900\">Contract signed</h2><p className=\"mt-2 text-sm text-emerald-800\">The contract is active and the vehicle status has been updated.</p>',\n    '<h2 className=\"text-2xl font-bold text-emerald-900\">Contract signed</h2><p className=\"mt-2 text-sm text-emerald-800\">The booking is signed. Start the rental from Contract Details when the vehicle is handed over.</p>',\n)'''
          new = '''replace(path, 'The contract is active and the vehicle status has been updated.', 'The booking is signed. Start the rental from Contract Details when the vehicle is handed over.')'''
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Apply minimal booking workflow patch
        run: python scripts/booking_workflow_patch.py
      - run: npm ci
      - name: Focused overlap regression test
        run: npm test -- src/lib/contractOverlap.test.ts
      - name: Production build
        run: npm run build
      - name: Commit verified source changes to isolated branch
        run: |
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/apply-booking-workflow.yml scripts/booking_workflow_patch.py .booking-workflow-trigger
          git add src/components/SignContractModal.tsx src/pages/NewContract.tsx src/pages/ContractDetail.tsx src/pages/Contracts.tsx
          git commit -m "Add safe booking-to-rental workflow"
          git push origin fleetdesk-booking-workflow
