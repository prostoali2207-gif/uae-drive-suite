name: Run isolated booking patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fleetdesk-booking-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Harden signature invalidation order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ContractDetail.tsx')
          s = p.read_text()
          old = '''    const { error } = await supabase
      .from("contracts")
      .update({
        start_date: editStartDate,
        start_time: formatTimeForDb(editStartTime),
        end_date: editEndDate,
        end_time: formatTimeForDb(editEndTime),
        car_id: editCarId,
        ...(invalidatesSignature ? { status: "Draft", client_signature: null, manager_signature: null } : {}),
      } as never)
      .eq("id", contract.id);
    setIsSavingEdit(false);
    if (error) {
      toast.error("Failed to save changes");
      return;
    }
    if (invalidatesSignature) {
      const { error: driverSignatureError } = await (supabase as any)
        .from("contract_drivers")
        .update({ signature: null, signed_at: null })
        .eq("contract_id", contract.id);
      if (driverSignatureError) {
        toast.error("Booking changed, but additional-driver signatures could not be reset.");
        await fetchData();
        return;
      }
      const { error: pdfDeleteError } = await supabase.storage.from("contract-pdfs").remove([`${contract.id}.pdf`]);
      if (pdfDeleteError) console.info("Old signed PDF could not be removed; it will be overwritten after re-signing.");
      toast.success("Booking updated — signatures need to be collected again");
    } else {
      toast.success("Booking updated");
    }'''
          new = '''    if (invalidatesSignature) {
      const { error: driverSignatureError } = await (supabase as any)
        .from("contract_drivers")
        .update({ signature: null, signed_at: null })
        .eq("contract_id", contract.id);
      if (driverSignatureError) {
        setIsSavingEdit(false);
        toast.error("Could not reset additional-driver signatures. Booking was not changed.");
        return;
      }
    }

    const { error } = await supabase
      .from("contracts")
      .update({
        start_date: editStartDate,
        start_time: formatTimeForDb(editStartTime),
        end_date: editEndDate,
        end_time: formatTimeForDb(editEndTime),
        car_id: editCarId,
        ...(invalidatesSignature ? { status: "Draft", client_signature: null, manager_signature: null } : {}),
      } as never)
      .eq("id", contract.id);
    setIsSavingEdit(false);
    if (error) {
      toast.error(
        invalidatesSignature
          ? "Booking was not changed. Additional-driver signatures were cleared and must be collected again."
          : "Failed to save changes",
      );
      await fetchData();
      return;
    }
    toast.success(
      invalidatesSignature
        ? "Booking updated — signatures need to be collected again"
        : "Booking updated",
    );'''
          if old not in s:
              raise SystemExit('Signature invalidation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Focused overlap regression test
        run: npm test -- src/lib/contractOverlap.test.ts
      - name: Production build
        run: npm run build
      - name: Commit hardened verified change
        run: |
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .booking-hardening-trigger
          git add src/pages/ContractDetail.tsx
          git commit -m "Harden booking signature invalidation"
          git push origin fleetdesk-booking-workflow
