name: Verify contract PDF share fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply stable contract PDF share fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SignContractModal.tsx')
          s = p.read_text()

          old = '''  const contract = loaded?.data as (ContractForPdf & {'''
          new = '''  const signedPdfUrl = contractId
    ? supabase.storage.from("contract-pdfs").getPublicUrl(`${contractId}.pdf`).data.publicUrl
    : "";

  const contract = loaded?.data as (ContractForPdf & {'''
          if old not in s:
              raise SystemExit('contract anchor not found')
          s = s.replace(old, new, 1)

          old = '''                <Button variant="outline" className="h-12 border-slate-300 bg-white" onClick={() => generateContractPdf({ ...loaded.data, client_signature: signatures.customer, manager_signature: signatures.company, contract_drivers: loaded.drivers.map((driver) => ({ ...driver, signature: signatures[`driver-${driver.id}`] })) })}>Download PDF</Button>'''
          new = '''                <Button variant="outline" className="h-12 border-slate-300 bg-white" onClick={() => {
                  if (!signedPdfUrl || !/^https?:\\/\\//i.test(signedPdfUrl)) {
                    toast.error("Public PDF link is not available");
                    return;
                  }
                  window.open(signedPdfUrl, "_blank", "noopener,noreferrer");
                }}>Open PDF</Button>'''
          if old not in s:
              raise SystemExit('download button anchor not found')
          s = s.replace(old, new, 1)

          old = '''                  const text = encodeURIComponent(pdfUrl ? `Your signed rental contract: ${pdfUrl}` : `Your rental contract is signed. Contract ID: ${contractId}`);'''
          new = '''                  if (!signedPdfUrl || !/^https?:\\/\\//i.test(signedPdfUrl)) {
                    toast.error("Public PDF link is not available");
                    return;
                  }
                  const text = encodeURIComponent(`Your signed rental contract: ${signedPdfUrl}`);'''
          if old not in s:
              raise SystemExit('WhatsApp URL anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit verified fix to PR branch
        run: |
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/SignContractModal.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Fix signed contract WhatsApp link"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
