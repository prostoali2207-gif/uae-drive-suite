name: Apply additional driver signatures

on:
  push:
    branches:
      - feature/additional-contract-drivers
    paths:
      - automation/run-additional-driver-signatures.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/additional-contract-drivers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add additional driver signatures and PDF pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:120]!r}')
              return text.replace(old, new, 1)

          sign_path = Path('src/components/SignContractModal.tsx')
          text = sign_path.read_text()

          text = replace_once(
              text,
              'import { generateContractPdf } from "@/lib/contractPdf";\n',
              'import { generateContractPdf } from "@/lib/contractPdf";\n'
              'import {\n'
              '  getContractDrivers,\n'
              '  saveContractDriverSignatures,\n'
              '  type ContractDriverRow,\n'
              '} from "@/lib/contractDrivers";\n',
          )

          text = replace_once(
              text,
              '  profile: CompanyProfile;\n}',
              '  profile: CompanyProfile;\n'
              '  drivers: ContractDriverRow[];\n'
              '}',
          )

          text = replace_once(
              text,
              'function ContractPage({\n  pageNo,\n  children,\n}: {\n  pageNo: number;\n  children: React.ReactNode;\n}) {',
              'function ContractPage({\n'
              '  pageNo,\n'
              '  pageTotal,\n'
              '  children,\n'
              '}: {\n'
              '  pageNo: number;\n'
              '  pageTotal: number;\n'
              '  children: React.ReactNode;\n'
              '}) {',
          )
          text = replace_once(text, '        Page {pageNo} of 3', '        Page {pageNo} of {pageTotal}')

          text = replace_once(
              text,
              '  onManagerClear,\n}: {\n'
              '  summary: ContractSummary;\n'
              '  clientSigRef: React.Ref<SigRef>;\n'
              '  managerSigRef: React.Ref<SigRef>;\n'
              '  onClientStroke: () => void;\n'
              '  onManagerStroke: () => void;\n'
              '  onClientClear: () => void;\n'
              '  onManagerClear: () => void;\n'
              '}) {',
              '  onManagerClear,\n'
              '  driverSigRefs,\n'
              '  onDriverStroke,\n'
              '  onDriverClear,\n'
              '}: {\n'
              '  summary: ContractSummary;\n'
              '  clientSigRef: React.Ref<SigRef>;\n'
              '  managerSigRef: React.Ref<SigRef>;\n'
              '  onClientStroke: () => void;\n'
              '  onManagerStroke: () => void;\n'
              '  onClientClear: () => void;\n'
              '  onManagerClear: () => void;\n'
              '  driverSigRefs: React.MutableRefObject<Record<string, SigRef | null>>;\n'
              '  onDriverStroke: (driverId: string) => void;\n'
              '  onDriverClear: (driverId: string) => void;\n'
              '}) {',
          )

          text = replace_once(
              text,
              '  const company = summary.profile;\n  const [inspectionQr, setInspectionQr] = useState("");',
              '  const company = summary.profile;\n'
              '  const driverPages = Array.from(\n'
              '    { length: Math.ceil(summary.drivers.length / 2) },\n'
              '    (_, index) => summary.drivers.slice(index * 2, index * 2 + 2),\n'
              '  );\n'
              '  const pageTotal = 3 + driverPages.length;\n'
              '  const [inspectionQr, setInspectionQr] = useState("");',
          )

          text = text.replace('<ContractPage pageNo={1}>', '<ContractPage pageNo={1} pageTotal={pageTotal}>', 1)
          text = text.replace('<ContractPage pageNo={2}>', '<ContractPage pageNo={2} pageTotal={pageTotal}>', 1)
          text = text.replace('<ContractPage pageNo={3}>', '<ContractPage pageNo={3} pageTotal={pageTotal}>', 1)

          final_page_anchor = '''      </ContractPage>\n    </div>\n  );\n}'''
          driver_pages = '''      </ContractPage>\n\n      {driverPages.map((drivers, pageIndex) => (\n        <ContractPage key={pageIndex} pageNo={4 + pageIndex} pageTotal={pageTotal}>\n          <SectionTitle num={9} title="ADDITIONAL DRIVERS" />\n          <p className="text-[10px] leading-relaxed text-[#0f172a]">\n            Each driver confirms that their driving documents are valid and that they agree to the driving obligations in this rental agreement.\n          </p>\n          <div className="mt-6 grid gap-5">\n            {drivers.map((driver) => (\n              <div key={driver.id}>\n                <div className="mb-3 grid gap-2 sm:grid-cols-3">\n                  <FieldCard label="Full Name" value={valueOrDash(driver.clients?.full_name)} />\n                  <FieldCard label="License Number" value={valueOrDash(driver.clients?.license_number)} />\n                  <FieldCard label="License Expiry" value={valueOrDash(driver.clients?.license_expiry ? fmtDate(driver.clients.license_expiry) : "-")} />\n                </div>\n                <SignatureBox\n                  title={`ADDITIONAL DRIVER ${driver.position}`}\n                  signer={driver.clients?.full_name || ""}\n                  canvasRef={(instance) => { driverSigRefs.current[driver.id] = instance; }}\n                  onStroke={() => onDriverStroke(driver.id)}\n                  onClear={() => onDriverClear(driver.id)}\n                />\n              </div>\n            ))}\n          </div>\n        </ContractPage>\n      ))}\n    </div>\n  );\n}'''
          text = replace_once(text, final_page_anchor, driver_pages)

          text = replace_once(
              text,
              '  const [managerSigHasContent, setManagerSigHasContent] = useState(false);\n',
              '  const [managerSigHasContent, setManagerSigHasContent] = useState(false);\n'
              '  const [driverSigHasContent, setDriverSigHasContent] = useState<Record<string, boolean>>({});\n',
          )
          text = replace_once(
              text,
              '  const managerSigRef = useRef<SigRef>(null);\n',
              '  const managerSigRef = useRef<SigRef>(null);\n'
              '  const driverSigRefs = useRef<Record<string, SigRef | null>>({});\n',
          )
          text = replace_once(
              text,
              '    setManagerSigHasContent(false);\n',
              '    setManagerSigHasContent(false);\n'
              '    setDriverSigHasContent({});\n'
              '    driverSigRefs.current = {};\n',
          )

          text = replace_once(
              text,
              '        const [contractRes, authRes] = await Promise.all([',
              '        const [contractRes, authRes, drivers] = await Promise.all([',
          )
          text = replace_once(
              text,
              '          supabase.auth.getUser(),\n        ]);',
              '          supabase.auth.getUser(),\n'
              '          getContractDrivers(contractId),\n'
              '        ]);',
          )
          text = replace_once(
              text,
              '          setSummary({ clientName: client, pdfData, previewData, profile });',
              '          setSummary({ clientName: client, pdfData, previewData, profile, drivers });',
          )

          text = replace_once(
              text,
              '    if (!summary?.pdfData) {\n',
              '    const missingDriverSignature = summary?.drivers.find((driver) => {\n'
              '      const ref = driverSigRefs.current[driver.id];\n'
              '      return !ref || ref.isEmpty();\n'
              '    });\n'
              '    if (missingDriverSignature) {\n'
              '      toast.error(`Signature is required for ${missingDriverSignature.clients?.full_name || "each additional driver"}.`);\n'
              '      return;\n'
              '    }\n'
              '    if (!summary?.pdfData) {\n',
          )

          text = replace_once(
              text,
              '    const managerSignature = managerSigRef.current.getDataUrl();\n',
              '    const managerSignature = managerSigRef.current.getDataUrl();\n'
              '    const driverSignatures = summary.drivers.map((driver) => ({\n'
              '      id: driver.id,\n'
              '      signature: driverSigRefs.current[driver.id]!.getDataUrl(),\n'
              '    }));\n'
              '    const signedDrivers = summary.drivers.map((driver) => ({\n'
              '      ...driver,\n'
              '      signature: driverSignatures.find((item) => item.id === driver.id)?.signature || null,\n'
              '      signed_at: new Date().toISOString(),\n'
              '    }));\n',
          )

          text = replace_once(
              text,
              '    setClientSigDataUrl(clientSignature);\n    setManagerSigDataUrl(managerSignature);',
              '    try {\n'
              '      await saveContractDriverSignatures(driverSignatures);\n'
              '    } catch (driverError) {\n'
              '      setSaving(false);\n'
              '      toast.error("Failed to save additional driver signatures: " + (driverError instanceof Error ? driverError.message : "unknown error"));\n'
              '      return;\n'
              '    }\n\n'
              '    setClientSigDataUrl(clientSignature);\n'
              '    setManagerSigDataUrl(managerSignature);\n'
              '    setSummary((current) => current ? { ...current, drivers: signedDrivers } : current);',
          )

          text = replace_once(
              text,
              '          manager_signature: managerSignature,\n        },',
              '          manager_signature: managerSignature,\n'
              '          contract_drivers: signedDrivers,\n'
              '        },',
          )

          text = replace_once(
              text,
              '                  onManagerClear={() => {\n'
              '                    managerSigRef.current?.clear();\n'
              '                    setManagerSigHasContent(false);\n'
              '                  }}\n'
              '                />',
              '                  onManagerClear={() => {\n'
              '                    managerSigRef.current?.clear();\n'
              '                    setManagerSigHasContent(false);\n'
              '                  }}\n'
              '                  driverSigRefs={driverSigRefs}\n'
              '                  onDriverStroke={(driverId) => {\n'
              '                    setDriverSigHasContent((current) => ({ ...current, [driverId]: true }));\n'
              '                  }}\n'
              '                  onDriverClear={(driverId) => {\n'
              '                    driverSigRefs.current[driverId]?.clear();\n'
              '                    setDriverSigHasContent((current) => ({ ...current, [driverId]: false }));\n'
              '                  }}\n'
              '                />',
          )

          text = replace_once(
              text,
              '{step === "review" && clientSigHasContent && managerSigHasContent && (',
              '{step === "review" && clientSigHasContent && managerSigHasContent && summary?.drivers.every((driver) => driverSigHasContent[driver.id]) && (',
          )

          text = replace_once(
              text,
              '                      manager_signature: managerSigDataUrl || null,\n                    });',
              '                      manager_signature: managerSigDataUrl || null,\n'
              '                      contract_drivers: summary.drivers,\n'
              '                    });',
          )

          sign_path.write_text(text)

          pdf_path = Path('src/lib/contractPdf.ts')
          pdf = pdf_path.read_text()
          pdf = replace_once(
              pdf,
              '  manager_signature?: string | null;\n',
              '  manager_signature?: string | null;\n'
              '  contract_drivers?: Array<{\n'
              '    id: string;\n'
              '    position: number;\n'
              '    signature: string | null;\n'
              '    clients: {\n'
              '      full_name: string;\n'
              '      license_number: string;\n'
              '      license_expiry: string | null;\n'
              '    } | null;\n'
              '  }>;\n',
          )

          extra_pdf = '''  const additionalDrivers = contract.contract_drivers ?? [];\n  const driversPerPage = 3;\n  for (let offset = 0; offset < additionalDrivers.length; offset += driversPerPage) {\n    const pageDrivers = additionalDrivers.slice(offset, offset + driversPerPage);\n    addContentPage();\n    sectionTitle(9, "Additional Drivers");\n    doc.setFont("helvetica", "normal");\n    doc.setFontSize(8);\n    doc.setTextColor(...ink);\n    doc.text(\n      "Each driver confirms that their driving documents are valid and agrees to the driving obligations in this rental agreement.",\n      margin,\n      y,\n      { maxWidth: contentW },\n    );\n    y += 30;\n\n    pageDrivers.forEach((driver) => {\n      const client = driver.clients;\n      const boxY = y;\n      doc.setFillColor(255, 255, 255);\n      setStroke(line, 0.7);\n      doc.roundedRect(margin, boxY, contentW, 174, 4, 4, "FD");\n      doc.setFont("helvetica", "bold");\n      doc.setFontSize(9);\n      doc.setTextColor(...blue);\n      doc.text(`ADDITIONAL DRIVER ${driver.position}`, margin + 14, boxY + 22);\n\n      doc.setFont("helvetica", "normal");\n      doc.setFontSize(8);\n      doc.setTextColor(...muted);\n      doc.text("Full Name", margin + 14, boxY + 45);\n      doc.text("License Number", margin + 205, boxY + 45);\n      doc.text("License Expiry", margin + 390, boxY + 45);\n      doc.setFont("helvetica", "bold");\n      doc.setTextColor(...ink);\n      doc.text(valueOrDash(client?.full_name), margin + 14, boxY + 60, { maxWidth: 170 });\n      doc.text(valueOrDash(client?.license_number), margin + 205, boxY + 60, { maxWidth: 160 });\n      doc.text(client?.license_expiry ? fmtDate(client.license_expiry) : "-", margin + 390, boxY + 60, { maxWidth: 120 });\n\n      if (driver.signature?.startsWith("data:image")) {\n        try { doc.addImage(driver.signature, "PNG", margin + 40, boxY + 78, 190, 50); } catch { /* ignore */ }\n      }\n      setStroke(line, 0.6);\n      doc.line(margin + 30, boxY + 132, margin + 250, boxY + 132);\n      doc.setFont("helvetica", "normal");\n      doc.setFontSize(8);\n      doc.setTextColor(...ink);\n      doc.text(`Date: ${today}`, margin + 30, boxY + 151);\n      y = boxY + 190;\n    });\n  }\n\n  renderFooters();'''
          pdf = replace_once(pdf, '  renderFooters();', extra_pdf)
          pdf_path.write_text(pdf)
          PY

      - run: npm ci
      - run: npm run build

      - name: Commit verified signatures implementation
        run: |
          rm -f automation/run-additional-driver-signatures.txt
          git config user.name "FleetDesk Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/SignContractModal.tsx src/lib/contractPdf.ts automation/run-additional-driver-signatures.txt
          git commit -m "feat: require additional driver signatures in contract PDF"
          git push origin feature/additional-contract-drivers
