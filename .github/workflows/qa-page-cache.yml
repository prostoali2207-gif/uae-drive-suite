name: QA page data cache

on:
  push:
    branches:
      - fix/stale-while-revalidate-main-tabs
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- src/lib/pageDataCache.test.ts
      - run: npm run build
