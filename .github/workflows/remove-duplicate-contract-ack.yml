name: Remove duplicate contract acknowledgement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-duplicate-contract-ack.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Remove duplicate acknowledgement block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/contractPdf.ts')
          content = path.read_text()
          old = '''  y += 142;

            doc.setFont("helvetica", "bold");
            doc.setFontSize(8.3);
            doc.setTextColor(...navy);
            doc.text("CUSTOMER ACKNOWLEDGEMENT", margin, y);
            y += 20;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8.2);
            doc.setTextColor(...muted);
            doc.text("The customer confirms that the vehicle condition and inspection record were available at handover.", margin, y, { maxWidth: contentW });
            y += 42;
            setStroke(line, 0.7);
            doc.line(margin, y, margin + 210, y);
            doc.line(pageW - margin - 150, y, pageW - margin, y);
            doc.setFontSize(7.5);
            doc.text("Customer signature", margin, y + 16);
            doc.text("Date", pageW - margin - 150, y + 16);

            addTermsPage(false);'''.replace('          ', '')
          new = '''  y += 142;

            addTermsPage(false);'''.replace('          ', '')
          if old not in content:
              raise SystemExit('Target acknowledgement block not found')
          path.write_text(content.replace(old, new))
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-duplicate-contract-ack.yml
          git add src/lib/contractPdf.ts
          git commit -m "Remove duplicate contract acknowledgement"
          git push origin HEAD:main
