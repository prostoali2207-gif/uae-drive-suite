name: Improve contract signing flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/improve-contract-signing-flow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch signing workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent as D

          path = Path('src/components/SignContractModal.tsx')
          s = path.read_text()

          s = s.replace(D('''
          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle,
          } from "@/components/ui/dialog";
          '''), '')

          s = s.replace(D('''
          interface SignContractModalProps {
            contractId: string;
            clientName: string;
            open: boolean;
            onComplete: () => void;
          }
          '''), D('''
          interface SignContractModalProps {
            contractId: string;
            clientName: string;
            open: boolean;
            onComplete: (signed?: boolean) => void;
          }
          '''))

          s = s.replace(D('''
          function SignatureBox({
            title,
            signer,
            canvasRef,
            onStroke,
            onClear,
          }: {
            title: string;
            signer: string;
            canvasRef: React.Ref<SigRef>;
            onStroke: () => void;
            onClear: () => void;
          }) {
            return (
              <div className="rounded border border-[#d6e0eb] bg-white p-3">
          '''), D('''
          function SignatureBox({
            title,
            signer,
            canvasRef,
            onStroke,
            onClear,
            sectionId,
          }: {
            title: string;
            signer: string;
            canvasRef: React.Ref<SigRef>;
            onStroke: () => void;
            onClear: () => void;
            sectionId?: string;
          }) {
            return (
              <div id={sectionId} className="scroll-mt-32 rounded border border-[#d6e0eb] bg-white p-3">
          '''))

          s = s.replace('''              <SignatureBox
                title="CUSTOMER"''', '''              <SignatureBox
                sectionId="signature-customer"
                title="CUSTOMER"''')
          s = s.replace('''              <SignatureBox
                title="COMPANY REPRESENTATIVE"''', '''              <SignatureBox
                sectionId="signature-company"
                title="COMPANY REPRESENTATIVE"''')
          s = s.replace('''                <SignatureBox
                  title={`ADDITIONAL DRIVER ${driver.position}`}''', '''                <SignatureBox
                  sectionId={`signature-driver-${driver.id}`}
                  title={`ADDITIONAL DRIVER ${driver.position}`}''')

          marker = D('''
                  <div className="mt-8">
                    <SectionTitle num={3} title="RENTAL PERIOD" />
          ''')
          insert = D('''
                  {summary.drivers.length > 0 && (
                    <div className="mt-8">
                      <SectionTitle num={3} title="AUTHORIZED ADDITIONAL DRIVERS" />
                      <div className="grid gap-2 sm:grid-cols-2">
                        {summary.drivers.map((driver) => (
                          <FieldCard
                            key={driver.id}
                            label={`Driver ${driver.position}`}
                            value={`${valueOrDash(driver.clients?.full_name)} · ${valueOrDash(driver.clients?.license_number)}`}
                          />
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="mt-8">
                    <SectionTitle num={summary.drivers.length > 0 ? 4 : 3} title="RENTAL PERIOD" />
          ''')
          if marker not in s:
            raise SystemExit('Rental period marker not found')
          s = s.replace(marker, insert, 1)
          s = s.replace('<SectionTitle num={4} title="FINANCIAL SUMMARY" />', '<SectionTitle num={summary.drivers.length > 0 ? 5 : 4} title="FINANCIAL SUMMARY" />', 1)
          s = s.replace('<SectionTitle num={5} title="VEHICLE CONDITION AT PICK-UP" />', '<SectionTitle num={summary.drivers.length > 0 ? 6 : 5} title="VEHICLE CONDITION AT PICK-UP" />', 1)

          old_wrapper = D('''
            return (
              <Dialog open={open} onOpenChange={(v) => { if (!v) onComplete(); }}>
                <DialogContent className="flex h-[100dvh] max-h-[100dvh] w-screen max-w-none flex-col gap-0 overflow-hidden rounded-none p-0 sm:h-[96vh] sm:w-[min(1180px,calc(100vw-2rem))] sm:rounded-lg">
                  <DialogHeader className="shrink-0 border-b border-border px-4 py-3 sm:px-6 sm:py-4">
                    <div className="flex items-center justify-between gap-3">
                      <DialogTitle className="flex items-center gap-2 text-base">
                        <FileText className="h-4 w-4" />
                        Review &amp; Sign Contract
                      </DialogTitle>
                      {step === "review" && (
                        <div className="hidden text-xs font-medium text-muted-foreground sm:block">
                          Scroll to the agreement section and sign in place
                        </div>
                      )}
                    </div>
                  </DialogHeader>
          ''')
          new_wrapper = D('''
            if (!open) return null;

            const pendingDriver = summary?.drivers.find((driver) => !driverSigHasContent[driver.id]);
            const allDriversSigned = !pendingDriver;
            const signingReady = termsAcknowledged && clientSigHasContent && managerSigHasContent && allDriversSigned;
            const nextRequirement = !termsOpened
              ? "Open the full terms"
              : !termsAcknowledged
                ? "Accept the terms"
                : !clientSigHasContent
                  ? `Customer signature: ${summary?.clientName || clientName}`
                  : pendingDriver
                    ? `Additional driver signature: ${pendingDriver.clients?.full_name || "driver"}`
                    : !managerSigHasContent
                      ? "Company representative signature"
                      : "Ready to save";

            const jumpTo = (id: string) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "center" });

            return (
              <div className="fixed inset-0 z-[100] flex h-[100dvh] flex-col overflow-hidden bg-slate-100 text-slate-950">
                <header className="shrink-0 border-b border-cyan-700 bg-cyan-600 px-3 py-3 text-white shadow-sm sm:px-6">
                  <div className="mx-auto flex max-w-6xl items-center justify-between gap-3">
                    <div className="flex min-w-0 items-center gap-3">
                      <Button type="button" variant="ghost" className="h-10 px-2 text-white hover:bg-white/15 hover:text-white" onClick={() => onComplete(false)}>
                        ← Back
                      </Button>
                      <div className="min-w-0">
                        <h1 className="flex items-center gap-2 truncate text-base font-bold"><FileText className="h-4 w-4" /> Review &amp; Sign Contract</h1>
                        <p className="truncate text-xs text-cyan-50">Customer → additional drivers → company representative</p>
                      </div>
                    </div>
                    <div className="shrink-0 rounded-full bg-white/15 px-3 py-1 text-xs font-bold">
                      {summary ? `${2 + summary.drivers.length} signers` : "Loading"}
                    </div>
                  </div>
                </header>
          ''')
          if old_wrapper not in s:
            raise SystemExit('Dialog wrapper anchor not found')
          s = s.replace(old_wrapper, new_wrapper, 1)

          preview_anchor = D('''
                        ) : summary ? (
                          <ContractHtmlPreview
          ''')
          preview_insert = D('''
                        ) : summary ? (
                          <>
                            <section className="mx-auto mb-3 max-w-[794px] rounded-xl border border-cyan-200 bg-white p-3 shadow-sm">
                              <div className="flex items-start justify-between gap-3">
                                <div>
                                  <div className="text-sm font-bold text-slate-950">Signing queue</div>
                                  <div className="text-xs text-slate-500">Pass the same phone to each person and tap their name.</div>
                                </div>
                                <div className="max-w-[45%] text-right text-xs font-semibold text-cyan-700">Next: {nextRequirement}</div>
                              </div>
                              <div className="mt-3 flex gap-2 overflow-x-auto pb-1">
                                <Button type="button" variant="outline" className={cn("h-10 shrink-0 border-slate-300 bg-white text-slate-900", clientSigHasContent && "border-emerald-400 bg-emerald-50 text-emerald-800")} onClick={() => jumpTo("signature-customer")}>Customer {clientSigHasContent ? "✓" : ""}</Button>
                                {summary.drivers.map((driver) => (
                                  <Button key={driver.id} type="button" variant="outline" className={cn("h-10 shrink-0 border-slate-300 bg-white text-slate-900", driverSigHasContent[driver.id] && "border-emerald-400 bg-emerald-50 text-emerald-800")} onClick={() => jumpTo(`signature-driver-${driver.id}`)}>
                                    {driver.clients?.full_name || `Driver ${driver.position}`} {driverSigHasContent[driver.id] ? "✓" : ""}
                                  </Button>
                                ))}
                                <Button type="button" variant="outline" className={cn("h-10 shrink-0 border-slate-300 bg-white text-slate-900", managerSigHasContent && "border-emerald-400 bg-emerald-50 text-emerald-800")} onClick={() => jumpTo("signature-company")}>Company {managerSigHasContent ? "✓" : ""}</Button>
                              </div>
                            </section>
                            <ContractHtmlPreview
          ''')
          if preview_anchor not in s:
            raise SystemExit('Preview anchor not found')
          s = s.replace(preview_anchor, preview_insert, 1)
          s = s.replace(D('''
                            onTermsAcknowledgedChange={setTermsAcknowledged}
                          />
                        ) : null}
          '''), D('''
                            onTermsAcknowledgedChange={setTermsAcknowledged}
                          />
                          </>
                        ) : null}
          '''), 1)

          old_footer = D('''
                  {step === "review" && termsAcknowledged && clientSigHasContent && managerSigHasContent && summary?.drivers.every((driver) => driverSigHasContent[driver.id]) && (
                    <div className="shrink-0 border-t border-border bg-background px-4 py-3 sm:px-6 sm:py-4">
                      <div className="flex justify-end">
                        <Button
                          className="min-h-10"
                          disabled={loadingData || !!loadError || saving}
                          onClick={handleSave}
                        >
                          {saving ? "Saving..." : "Complete & Save"}
                        </Button>
                      </div>
                    </div>
                  )}
          ''')
          new_footer = D('''
                  {step === "review" && (
                    <div className="shrink-0 border-t border-slate-200 bg-white px-3 py-3 sm:px-6">
                      <div className="mx-auto flex max-w-6xl items-center justify-between gap-3">
                        <div className="min-w-0 text-xs text-slate-600"><span className="font-bold text-slate-900">Next:</span> {nextRequirement}</div>
                        <Button className="h-11 shrink-0 bg-cyan-600 px-5 font-bold text-white hover:bg-cyan-700" disabled={loadingData || !!loadError || saving || !signingReady} onClick={handleSave}>
                          {saving ? "Saving..." : "Save signed contract"}
                        </Button>
                      </div>
                    </div>
                  )}
          ''')
          if old_footer not in s:
            raise SystemExit('Footer anchor not found')
          s = s.replace(old_footer, new_footer, 1)
          s = s.replace('<Button onClick={onComplete}>Close</Button>', '<Button onClick={() => onComplete(true)}>Close</Button>', 1)
          s = s.replace(D('''
                </DialogContent>
              </Dialog>
            );
          '''), D('''
              </div>
            );
          '''), 1)
          path.write_text(s)

          page = Path('src/pages/NewContract.tsx')
          n = page.read_text()
          pickup = '<Summary label="Pickup photos" value={`${photos.length} photo${photos.length === 1 ? "" : "s"}`} />'
          n = n.replace(pickup, pickup + '<Summary label="Additional drivers" value={additionalDriverIds.length ? additionalDriverIds.map((id) => clients.find((client) => client.id === id)?.full_name).filter(Boolean).join(", ") : "None"} />', 1)
          n = n.replace('<SignContractModal contractId={contractId} clientName={clientName} open={signOpen} onComplete={() => { setSignOpen(false); setStep(4); }} />', '<SignContractModal contractId={contractId} clientName={clientName} open={signOpen} onComplete={(signed) => { setSignOpen(false); if (signed) setStep(4); }} />', 1)
          page.write_text(n)
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/improve-contract-signing-flow.yml
          git config user.name "fleetdesk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/SignContractModal.tsx src/pages/NewContract.tsx .github/workflows/improve-contract-signing-flow.yml
          git commit -m "Improve multi-party contract signing flow"
          git push origin main
