name: Apply mobile fee edit fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-mobile-fee-edit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add fee edit action on mobile transaction rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ContractDetail.tsx')
          text = path.read_text()
          old = '''                          {transaction.contractFee ? (\n                            <Button\n                              type="button"\n                              variant="ghost"\n                              size="icon"\n                              aria-label="Delete fee"\n                              className="h-8 w-8 text-muted-foreground hover:bg-transparent hover:text-destructive"\n                              onClick={() => onDeleteFee(transaction.contractFee!)}\n                            >\n                              <Trash2 className="h-3.5 w-3.5" />\n                            </Button>\n                          ) : null}'''
          new = '''                          {transaction.contractFee ? (\n                            <>\n                              <Button\n                                type="button"\n                                variant="ghost"\n                                size="icon"\n                                aria-label="Edit fee amount"\n                                className="h-8 w-8 text-muted-foreground hover:bg-transparent hover:text-foreground"\n                                onClick={() => onEditFeeAmount(transaction.contractFee!)}\n                              >\n                                <Pencil className="h-3.5 w-3.5" />\n                              </Button>\n                              <Button\n                                type="button"\n                                variant="ghost"\n                                size="icon"\n                                aria-label="Delete fee"\n                                className="h-8 w-8 text-muted-foreground hover:bg-transparent hover:text-destructive"\n                                onClick={() => onDeleteFee(transaction.contractFee!)}\n                              >\n                                <Trash2 className="h-3.5 w-3.5" />\n                              </Button>\n                            </>\n                          ) : null}'''
          if old not in text:
              raise SystemExit('Target fee action block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit verified fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-mobile-fee-edit.yml
          git config user.name "FleetDesk Agent"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/ContractDetail.tsx .github/workflows/fix-mobile-fee-edit.yml
          git commit -m "fix: restore charge editing on mobile"
          git push origin main
